<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Largo E-Score: Brad Pitt</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <span class="logo"><span class="l-mark">L</span>argo</span>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#">DASHBOARD</a></li>
        <li><a href="#" class="active">SMART SEARCH</a></li>
        <li><a href="#">LIST VIEW</a></li>
      </ul>
      <div class="nav-avatar">A</div>
    </div>
  </nav>

  <main class="content page">
    <!-- Celebrity header -->
    <section class="header-card">
      <div class="badge">E-SCORE<br>CELEBRITY</div>
      <div class="celeb-photo"></div>
      <h1 class="celeb-name">Brad Pitt</h1>
      <div class="header-controls">
        <div class="control-group">
          <label for="fielding-date">Fielding date:</label>
          <select id="fielding-date">
            <option>July 25, 2025</option>
          </select>
        </div>
        <div class="control-group">
          <label for="filter-by">Filter by:</label>
          <select id="filter-by">
            <option>Total males</option>
          </select>
        </div>
        <button class="btn-export">Export</button>
      </div>
    </section>

    <!-- Section tabs -->
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true">Scorecard</button>
      <button class="tab" role="tab">Awareness</button>
      <button class="tab" role="tab">Appeal</button>
      <button class="tab" role="tab">Attributes</button>
      <button class="tab" role="tab">Trends</button>
      <button class="tab" role="tab">Endorsement</button>
      <button class="tab" role="tab">Fandom</button>
      <button class="tab" role="tab">Social Media</button>
      <button class="tab" role="tab">Consumer comments</button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="btn-subscription">Subscription details</button>
      <button class="btn-icon" title="Table view">&#9638;</button>
      <div class="toggle-group">
        <button class="btn-icon active" title="Percent">%</button>
        <button class="btn-icon" title="Count">#</button>
      </div>
    </div>

    <!-- Top card row -->
    <section class="top-row">
      <!-- E-Score -->
      <div class="card escore-card">
        <div class="escore-label">E-SCORE</div>
        <div class="escore-value" id="escore-value">—</div>
        <button class="btn-onesheet">&#8595; Download Celebrity One-Sheet</button>
        <a class="imdb-link" href="#">Link to Celebrity's IMDb page</a>
      </div>

      <!-- Awareness -->
      <div class="card awareness-card">
        <div class="awareness-title">Awareness</div>
        <div class="awareness-value" id="awareness-value">—</div>
        <div class="awareness-sub">Category Averages for this Celebrity:</div>
        <ul class="awareness-list" id="awareness-list"></ul>
      </div>

      <!-- News carousel (rendered from NEWS in data.js by app.js) -->
      <div class="news-carousel">
        <div class="news-controls">
          <button class="news-arrow" id="news-prev" aria-label="Previous news">&#8249;</button>
          <button class="news-arrow" id="news-next" aria-label="Next news">&#8250;</button>
        </div>
        <div class="news-viewport">
          <div class="news-track" id="news-track"></div>
        </div>
      </div>
    </section>

    <!-- Chart grid -->
    <section class="chart-grid">
      <div class="card chart-card">
        <div class="chart-head">
          <div>
            <div class="chart-title">Total Appeal</div>
          </div>
          <div class="chart-actions"><span>&hellip;</span><span>&#8599;</span></div>
        </div>
        <div class="chart" id="chart-total-appeal"></div>
      </div>

      <div class="card chart-card">
        <div class="chart-head">
          <div>
            <div class="chart-title">Attributes</div>
          </div>
          <div class="chart-actions"><span>&hellip;</span><span>&#8599;</span></div>
        </div>
        <div class="chart" id="chart-attributes"></div>
      </div>

      <div class="card chart-card">
        <div class="chart-head">
          <div>
            <div class="chart-title">Appeal</div>
            <div class="chart-subtitle">Film Personality - Actor</div>
          </div>
          <div class="chart-actions"><span>&hellip;</span><span>&#8599;</span></div>
        </div>
        <div class="chart" id="chart-appeal"></div>
      </div>

      <div class="card chart-card">
        <div class="chart-head">
          <div>
            <div class="chart-title">Power Factors&trade;</div>
          </div>
          <div class="chart-actions"><span>&hellip;</span><span>&#8599;</span></div>
        </div>
        <div class="chart" id="chart-power-factors"></div>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"
    integrity="sha384-C2iskrW/uPW46KzOjrvJIQo4YkV8lkD+QS0CrDN18IIPIpT/g2USu8bTP3nvmIAD"
    crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
